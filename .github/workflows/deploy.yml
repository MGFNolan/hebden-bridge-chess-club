# .github/workflows/deploy.yml

# This workflow is designed to build a Vite project and deploy it to GitHub Pages.

name: Build and Deploy to GitHub Pages

on:
    # Runs on pushes targeting the `main` branch.
    push:
        branches: ["main"]

    # Allows you to run this workflow manually from the Actions tab on GitHub.
    workflow_dispatch:

# Sets the permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
# This is a security best practice.
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # Build job: builds the site from source.
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20" # Specify your project's Node.js version
                  cache: "npm"
            - name: Install dependencies
              run: npm ci # 'ci' is generally faster and safer for workflows than 'install'
            - name: Build project
              run: npm run build
              env:
                  # Pass the secrets as environment variables to the build command
                  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
                  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  # Vite's default build output directory is 'dist'
                  path: "./dist"

    # Deploy job: deploys the built site to GitHub Pages.
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build # This job depends on the 'build' job completing successfully
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
